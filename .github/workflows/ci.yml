name: ci

# Pull requests and main run the same checks as `make verify`, with no cloud
# access at all: no id-token permission, no secrets, no role to assume.
# Shared checks come from reusable workflows in gamaware/.github. The app job
# calls the Makefile, so local runs and CI cannot drift apart.
on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-docs:
    name: Lint docs
    permissions:
      contents: read
    uses: gamaware/.github/.github/workflows/lint-docs.yml@main
    with:
      # CHANGELOG.md is left out of Vale: it carries a tracked TODO by design.
      vale-paths: README.md docs infra

  lint-actions:
    name: Lint workflows
    permissions:
      contents: read
    uses: gamaware/.github/.github/workflows/lint-actions.yml@main

  secrets:
    name: Secret scan
    permissions:
      contents: read
    uses: gamaware/.github/.github/workflows/secrets.yml@main

  security:
    name: Security
    permissions:
      contents: read
    uses: gamaware/.github/.github/workflows/security.yml@main
    with:
      checkov-config: .checkov.yaml
      trivy-skip-dirs: app/node_modules

  terraform:
    name: Terraform
    permissions:
      contents: read
    uses: gamaware/.github/.github/workflows/terraform.yml@main
    with:
      working-directories: '["infra/terraform/registry", "infra/terraform/service"]'
      terraform-version: 1.14.5

  container:
    name: Container
    permissions:
      contents: read
    uses: gamaware/.github/.github/workflows/container.yml@main
    with:
      context: app
      dockerfile: app/Dockerfile
      image-name: harbor-stock-api

  app:
    name: App tests and smoke test
    # ARM64 runner: the image is built for the same architecture the Fargate
    # task runs (Graviton), so the smoke test exercises the shipped binary.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Unit tests
        run: make app-test

      - name: Build image
        run: make image

      - name: Smoke test
        run: make smoke
